spring.application.name=innova
server.port=8080

# SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://innova_solutions.mssql.somee.com:1433;databaseName=innova_solutions;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:innova}
spring.datasource.password=${DB_PASSWORD:innova-solutions}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
